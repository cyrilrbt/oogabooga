name: Browser downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-release
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test assembly core
        run: ./build.sh test
      - name: Build release app
        run: ./build.sh release
      - name: Package app and disk image
        run: ./tools/package-mac.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos-downloads
          path: |
            build/dist/*.app.zip
            build/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install native development and test libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsqlite3-dev xvfb xauth dbus-x11
      - name: Test assembly core and browser
        run: |
          ./build.sh test
          ./tools/test-linux.sh
      - name: Package native executable
        run: |
          ./build.sh release
          ./tools/package-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: linux-downloads
          path: build/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  flatpak:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Build Flatpak with the image's installed SDK
        # Avoid --install-deps-from: updating preinstalled OSTree deployments on
        # the container overlay filesystem can fail with EXDEV (cross-device link).
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          dbus-run-session -- ./tools/build-flatpak.sh
      - uses: actions/upload-artifact@v6
        with:
          name: flatpak-downloads
          path: build/dist/*.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [macos, linux, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-downloads'
          path: dist
          merge-multiple: true
      - name: Checksum all downloads
        working-directory: dist
        run: |
          version=$(../tools/version.sh)
          sha256sum "Oogabooga-${version}-macos-arm64.app.zip" \
            "Oogabooga-${version}-macos-arm64.dmg" \
            "Oogabooga-${version}-linux-x86_64.flatpak" \
            "Oogabooga-${version}-linux-x86_64.tar.gz" > "SHA256SUMS-${version}.txt"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(./tools/version.sh)
          tag="v${version}+build.${RUN_ID}.${RUN_ATTEMPT}"
          cat > release-notes.md <<EOF_NOTES
          Oogabooga ${version}, built from commit ${COMMIT}.

          Linux x86-64: install the Flatpak bundle with:
          \`flatpak install --user ./Oogabooga-${version}-linux-x86_64.flatpak\`
          Then run \`flatpak run dev.oogabooga.Browser\`.
          A native archive for Ubuntu 24.04+ with GTK 3 / WebKitGTK 4.1 is also included.

          Apple silicon macOS 12+: open the DMG and drag Oogabooga into Applications, or extract the app ZIP.
          macOS builds are ad-hoc signed, not Developer ID signed or notarized; Gatekeeper may block downloaded builds.

          SHA-256 checksums are included in SHA256SUMS-${version}.txt. Flatpak bundles are published here, not on Flathub.
          EOF_NOTES
          gh release create "$tag" dist/* \
            --target "$COMMIT" \
            --title "Oogabooga ${version} (${COMMIT:0:7})" \
            --notes-file release-notes.md \
            --latest
          {
            echo '### Downloads'
            echo "- [Linux Flatpak](https://github.com/${GH_REPO}/releases/download/${tag}/Oogabooga-${version}-linux-x86_64.flatpak)"
            echo "- [macOS DMG](https://github.com/${GH_REPO}/releases/download/${tag}/Oogabooga-${version}-macos-arm64.dmg)"
            echo "- [macOS app ZIP](https://github.com/${GH_REPO}/releases/download/${tag}/Oogabooga-${version}-macos-arm64.app.zip)"
            echo "- [Linux archive](https://github.com/${GH_REPO}/releases/download/${tag}/Oogabooga-${version}-linux-x86_64.tar.gz)"
            echo "- [All assets](https://github.com/${GH_REPO}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"
