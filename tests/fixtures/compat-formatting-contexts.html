<!doctype html><meta charset="utf-8"><title>Formatting context boundaries</title>
<style>
body{margin:0;background:white;color:#222;font:16px/20px Arial}div,h1,p,form{margin:0;padding:0}
.float{float:left;width:180px;height:80px;background:#fee}
.panel{overflow:auto;width:300px;background:#eef;margin-left:4px;padding:6px;border:2px solid #888}
h1{font-size:20px;line-height:24px}a{color:#205020;text-decoration:none}
.row{display:flex;width:600px;gap:20px;align-items:center;background:#efe}
.left{width:100px;flex-shrink:0}.right{display:flex;gap:10px;align-items:center}
.clear{clear:both}
</style>
<div class=float>Float</div><div class=panel><h1><a href=/first>Panel heading</a></h1><p>Panel content café 🌐 stays in its own formatting context.</p></div>
<p class=clear>After floats</p>
<div class=row><div class=left>Left</div><div class=right><span>Middle</span><a href=/second>Right</a></div></div>
