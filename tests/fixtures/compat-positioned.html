<!doctype html><title>Compatibility: absolute and fixed boxes</title>
<style>
body{margin:0;background:white;font:10px/1 monospace}div{margin:0;padding:0}
#parent{position:relative;width:200px;height:100px;background:blue}
#absolute{position:absolute;right:10px;bottom:20px;width:40px;height:10px;background:green}
#after{width:100px;height:10px;background:red}
#fixed{position:fixed;left:250px;top:20px;width:30px;height:20px;background:yellow}
</style><div id=parent><div id=absolute></div></div><div id=after></div><div id=fixed></div>
